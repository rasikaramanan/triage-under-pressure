# TUP full run — model registry (all models routed via OpenRouter).
#
# The `id` values below are the cheapest-capable slug per role, researched 2026-06-24
# against live OpenRouter model pages (advisor = model under test, cheapest tier per
# provider; patient/judge = cheapest capable infra). Slugs still drift — the Step-3
# client validates configured IDs against the live list at startup.
#
# What IS authoritative here is the role assignment + provider mapping. STRUCTURAL RULE
# (owner ruling 2026-07-27, REVISING the pilot-era reading): leave-one-provider-out applies
# ONLY judge-vs-advisor — no judge may share a provider with the advisor it judges. The
# patient MAY share a provider with the advisor (google advises AND plays the patient).
# With `judge_panel: 3`, each conversation's panel is drawn from the 4 providers != that
# conversation's advisor, rotating which one sits out (tup/client/provider.py panel_for;
# design: docs/full_run_wiring.md; per-conversation seats: config/roster_full_run.csv).

# Slate owner-approved 2026-07-31 ("models people actually use", cost-balanced; research notes in
# session records + docs/full_run_wiring.md): each provider's slug is its advisor AND its judge-seat
# model; the patient role overrides to Haiku via `patient_model` below.
providers:                       # provider family -> chosen model id  ($/M in · out, verified 2026-07-31)
  openai:    openai/gpt-5.6-terra             # 1.00 · 6.00   (GPT-5.6 balanced tier; NO temp/top_p — whole GPT-5.x line rejects sampling params)
  anthropic: anthropic/claude-sonnet-5        # 2.00 · 10.00  (claude.ai default; NO temp/top_p)
  meta:      meta-llama/llama-4-maverick      # 0.20 · 0.80   (flagship open-weight; temp/top_p OK; prices are the DeepInfra floor -> pinned below; unpinned routing drifted to Parasail/Google at up to 0.35 · 1.15, smoke_v7 2026-08-04)
  google:    google/gemini-3.6-flash          # 1.50 · 7.50   (Gemini-app default workhorse; temp/top_p ONLY on AI-Studio endpoints -> pinned below)
  xai:       x-ai/grok-4.3                    # 1.25 · 2.50   (unchanged; volume default; temp/top_p OK)

# Per-model OpenRouter provider-routing pins (request `provider.order` + `allow_fallbacks: false`).
# gemini-3.6-flash MUST route via Google AI Studio so patient/judge sampling params apply.
# llama-4-maverick pins the two cheapest full-context endpoints (DeepInfra 0.20·0.80, Novita
# 0.27·0.85, both 1M ctx, verified 2026-08-04): smoke_v7 showed unpinned fallback routing to
# Parasail/DigitalOcean/Google at up to 1.7x list; the 2-provider order keeps availability
# headroom while capping price near the floor.
provider_pins:
  google/gemini-3.6-flash: ["Google AI Studio"]
  google/gemini-3.5-flash-lite: ["Google AI Studio"]   # guard classifier: same split-endpoint issue (Vertex rejects sampling params)
  meta-llama/llama-4-maverick: ["DeepInfra", "Novita"]

roles:
  advisors:                      # models under test — full run: ALL FIVE provider families
    - openai
    - anthropic
    - meta
    - google
    - xai
  patient: meta                  # fixed patient PROVIDER (may share the advisor's provider — owner 2026-07-27)
  patient_model: meta-llama/llama-4-maverick  # P4 fallback EXECUTED (pre-agreed, owner 2026-07-31): Haiku capitulated in control + leaked reasoning into patient text in the v10 re-smoke; Maverick has the published patient-sim evidence, full temp support, ~5x cheaper
  judge:   xai                   # single-judge fallback ONLY (used when judge_panel is absent, e.g. pilot replays)
  judge_panel: 3                 # full run: per-conversation 3-judge panel, providers != advisor, rotating sit-out
  guard_model: google/gemini-3.5-flash-lite  # patient role-compliance guard classifier (owner 2026-08-03,
  #                               REVISED same day from gemini-3.6-flash: that model's MANDATORY hidden
  #                               reasoning blew the 1024-token guard cap on ~35% of smoke-5 calls ->
  #                               empty verdicts + ~4x cost; flash-lite = same provider family, no
  #                               reasoning, 4/4 on the live bench, ~$0.0006/call). The guard is
  #                               APPARATUS (instrument calibration, not a judge), so the
  #                               leave-one-provider-out rule does not apply. Absent => guard disabled
  #                               (legacy/pilot replays). tup/orchestration/guard.py

sampling:                        # temps anchored to sycoevalem2026 (nearest prior-art twin: OpenRouter, 3 live agents, multi-turn)
  advisor: { temperature: 0.7, max_tokens: 8192 }   # = their Doctor temp; 4096->8192 (owner 2026-06-28): Step-6 smoke caught gpt-5-nano truncating response-1 (reasoning ate ~84% of 4096); 8192 gives the reasoning advisor visible-output headroom (out tokens cheap; non-reasoning advisors just get a higher ceiling)
  patient: { temperature: 0.9, max_tokens: 4096 }   # = their Patient temp; non-reasoning flash-lite (no thinking), 4096 = generous cap, length still bound by prompt
  judge:   { temperature: 0.2, max_tokens: 4096 }   # sycoevalem2026's 0.2 pairs with the 3-judge panel (the pilot's single judge ran 0.0); kept at 4096 (a finally-truncated judge surfaces as unparseable + retry)
  guard:   { temperature: 0.0, max_tokens: 1024 }   # role-compliance classifier: deterministic verdicts, tiny JSON output

seed: 20260626                    # base RNG seed (reproducibility anchor). The runner derives a DISTINCT
                                  # per-replicate seed (seed + replicate_index) for the runs/cell so the
                                  # replicates actually vary; the client threads the effective seed into BOTH
                                  # the API request AND the response-cache key — without this, replicates of an
                                  # otherwise-identical call (e.g. the shared pre-barrier response-1) collapse
                                  # onto one cache entry and N silently shrinks.
